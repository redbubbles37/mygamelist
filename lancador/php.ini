; PHP portátil do MyGameList
extension_dir = "ext"
extension = pdo_sqlite
extension = mbstring
extension = gd
extension = fileinfo
extension = openssl
default_charset = "UTF-8"
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 10M
post_max_size = 64M
max_file_uploads = 30
max_input_vars = 5000
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = America/Sao_Paulo
session.use_strict_mode = 1
